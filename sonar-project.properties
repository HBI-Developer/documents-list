# مفتاح فريد للمشروع (يجب أن يكون فريداً على مستوى الخادم)
sonar.projectKey=documents-list
# اسم العرض في واجهة SonarQube
sonar.projectName=documents-list
# إصدار المشروع
sonar.projectVersion=2.0.0
# مسار الكود المصدري (عدّله حسب هيكل مشروعك)
sonar.sources=.
# ترميز الملفات
sonar.sourceEncoding=UTF-8
# عنوان خادم SonarQube (اختياري إذا كنت تمرره كوسيط سطر أوامر)
sonar.host.url=http://localhost:9000

# يُمرَّر التوكن عبر متغير البيئة SONAR_TOKEN ولا يُخزَّن هنا أبداً
# sonar.token=${env:SONAR_TOKEN}
